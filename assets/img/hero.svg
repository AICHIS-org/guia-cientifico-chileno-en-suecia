    <path d="M327 319v175m78-175v175" stroke="#0B2545" stroke-width="5" opacity=".16"/>
    <rect x="287" y="491" width="32" height="22" rx="6" fill="#0B2545"/>
    <rect x="411" y="491" width="32" height="22" rx="6" fill="#0B2545"/>
    <circle cx="303" cy="513" r="7" fill="#34516B"/>
    <circle cx="427" cy="513" r="7" fill="#34516B"/>
    <circle cx="366" cy="407" r="48" fill="#F7F9FC" stroke="#0B2545" stroke-width="4"/>
    <path d="M356 382h20m-15 0v19l-16 25c-3 5 0 11 6 11h31c6 0 9-6 6-11l-17-25v-19" fill="none" stroke="#006AA7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M350 421c9-5 15 6 23 0 4-3 7-3 11-1l5 10c2 4-1 7-7 7h-31c-6 0-9-6-6-11Z" fill="#006AA7"/>
    <circle cx="359" cy="414" r="3" fill="#006AA7"/>
    <circle cx="376" cy="411" r="2" fill="#006AA7"/>

    <!-- A small Chilean copihue adds warmth to the near foreground. -->
    <path d="M134 552c-4-51 9-83 32-111" fill="none" stroke="#4B8588" stroke-width="6" stroke-linecap="round"/>
    <path d="M143 510c-31-8-40-29-39-38 25-1 39 9 43 29m6-19c7-23 27-30 41-27-4 21-18 32-41 34" fill="#6C9E86"/>
    <path d="M166 439c-3 11-3 19 1 27" fill="none" stroke="#4B8588" stroke-width="4" stroke-linecap="round"/>
    <path d="M153 461c-2-17 3-29 12-31 6 11 13 12 19 7 4 18-4 34-17 38-7-1-12-6-14-14Z" fill="#D52B1E"/>
    <path d="M159 461c4 8 9 10 14 9" fill="none" stroke="#F28471" stroke-width="3" stroke-linecap="round"/>
    <path d="M99 540h13m84-6h18m291-8h19m549-30h18" stroke="#6C9E86" stroke-width="4" stroke-linecap="round" opacity=".7"/>
  </g>
</svg>
