      <path d="m747 379 33-92 33 92h-15l21 35h-78l21-35Z"/>
      <path d="m1056 362 30-91 31 91h-13l20 35h-74l19-35Z"/>
      <path d="m1132 388 26-73 27 73h-11l18 29h-67l18-29Z"/>
    </g>
    <g fill="#4B8588">
      <path d="m684 410 32-91 32 91h-14l21 37h-78l21-37Z"/>
      <path d="m1093 406 31-96 32 96h-14l23 39h-82l24-39Z"/>
