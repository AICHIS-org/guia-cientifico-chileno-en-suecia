<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">A journey from Chile to Sweden</title>
  <desc id="hero-desc">Andean peaks, a travel suitcase with a science emblem, and a red Swedish cabin among pine trees are connected by a dotted route beneath a bright northern sky.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7F3FA"/>
      <stop offset="1" stop-color="#F7F9FC"/>
    </linearGradient>
    <linearGradient id="distant-hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C5DDE8"/>
      <stop offset="1" stop-color="#E8F0EF"/>
    </linearGradient>
    <clipPath id="panel-clip">
      <rect x="8" y="8" width="1184" height="544" rx="36"/>
    </clipPath>
  </defs>

  <rect x="8" y="8" width="1184" height="544" rx="36" fill="#F7F9FC" stroke="#DCE8EE" stroke-width="2"/>
  <g clip-path="url(#panel-clip)">
    <rect x="9" y="9" width="1182" height="542" fill="url(#sky)"/>

    <!-- A pale sun and a few rounded clouds keep the sky open. -->
    <circle cx="990" cy="112" r="51" fill="#FECC00" opacity=".26"/>
    <circle cx="990" cy="112" r="31" fill="#FECC00"/>
    <path d="M105 111h104m-72-13c7-18 33-18 40 0m-62 13c-3-14 8-25 21-25" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity=".8"/>
    <path d="M788 82h91m-65-12c5-13 23-13 28 0" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity=".72"/>
    <circle cx="309" cy="92" r="3" fill="#006AA7" opacity=".35"/>
    <circle cx="724" cy="147" r="3" fill="#006AA7" opacity=".35"/>

    <!-- The Andes settle into lower northern hills. -->
    <path d="M8 351 91 268l37 39 92-128 81 113 53-71 112 132 70-57 92 83H8Z" fill="#D7E6EB"/>
    <path d="m8 368 83-100 37 39 92-128 81 113 53-71 112 132 70-57 92 83v63H8Z" fill="url(#distant-hill)"/>
    <path d="m157 267 63-88 64 89-39-20-25 14-21-20Z" fill="#F7F9FC"/>
    <path d="m308 283 46-62 53 63-31-19-22 12-19-15Z" fill="#F7F9FC"/>
    <path d="m69 294 22-26 26 28-19-8-11 8-8-7Z" fill="#F7F9FC" opacity=".9"/>
    <path d="M580 362c95-66 166-57 255-45 118 15 207-57 357-16v150H580Z" fill="#D9EBEC"/>
    <path d="M8 387c167-43 265-10 385-31 126-23 186-41 293 2 153 60 278-13 506-9v203H8Z" fill="#E8F1EA"/>

    <!-- The dotted journey crosses the generous area of sky. -->
    <path d="M172 211C324 74 617 53 849 199" fill="none" stroke="#006AA7" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 15" opacity=".72"/>
    <circle cx="169" cy="214" r="12" fill="#F7F9FC" stroke="#D52B1E" stroke-width="5"/>
    <circle cx="849" cy="199" r="12" fill="#F7F9FC" stroke="#006AA7" stroke-width="5"/>
    <g transform="translate(550 92) rotate(11)">
      <path d="M-35 1-6-3 10-26c3-4 8-5 12-3L12-3l30 5c6 1 8 5 4 8L12 12l-12 15-9-1 6-16-31 1-10 8-7-2 6-13-6-13 7-2Z" fill="#006AA7"/>
      <path d="m-6-3 18 0-5 13-10 0Z" fill="#0B2545" opacity=".16"/>
    </g>

