    <ellipse cx="367" cy="510" rx="130" ry="15" fill="#0B2545" opacity=".12"/>
    <path d="M328 321v-32c0-12 10-22 22-22h31c12 0 22 10 22 22v32" fill="none" stroke="#0B2545" stroke-width="12" stroke-linecap="round"/>
