    <rect x="873" y="380" width="20" height="25" fill="#92C6D5"/>
    <path d="M883 380v25m-10-13h20" stroke="#F7F9FC" stroke-width="3"/>
    <rect x="993" y="373" width="39" height="40" rx="2" fill="#F7F9FC"/>
    <rect x="1000" y="380" width="25" height="25" fill="#92C6D5"/>
    <path d="M1012 380v25m-12-13h25" stroke="#F7F9FC" stroke-width="3"/>
    <rect x="1010" y="279" width="23" height="49" rx="2" fill="#D52B1E"/>
    <path d="M1005 281h33l-5-9h-23Z" fill="#F7F9FC"/>

