    <path d="M836 350 948 262l119 88-12 15-107-79-102 79Z" fill="#0B2545"/>
    <path d="M836 350 948 262l119 88-11 9-108-79-102 79Z" fill="#F7F9FC"/>
    <path d="M847 348h209v17H847Z" fill="#B6231E" opacity=".38"/>
    <rect x="917" y="376" width="61" height="84" rx="3" fill="#F4E3B2"/>
    <rect x="927" y="386" width="41" height="74" fill="#0B2545"/>
    <circle cx="961" cy="427" r="3" fill="#FECC00"/>
